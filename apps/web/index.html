<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZunDeck — Live Preview Workbench &amp; 30 Template Studio</title>
  <meta name="description" content="ZunDeck Live Preview Workbench: test 30 role-based portfolios and Custom Canvas across Laptop, Phone Desktop, and Mobile viewports.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Top App Bar -->
  <header class="app-header">
    <div class="header-left">
      <div class="app-brand">
        <span class="brand-glyph">Z</span>
        <div class="brand-text">
          <span class="brand-title">ZunDeck</span>
          <span class="brand-sub">Workbench &bull; 30 Templates</span>
        </div>
      </div>
      <div class="sync-pill" id="sync-status-indicator" title="Connected to Mother Showcase">
        <span class="sync-dot"></span>
        <span id="sync-status-label">Mother Showcase Synced</span>
      </div>
    </div>

    <!-- Viewport Switcher Controls -->
    <div class="viewport-controls" role="group" aria-label="Responsive Viewport Selector">
      <button type="button" class="viewport-btn active" data-viewport="laptop" title="Laptop / Wide Desktop (1440px)">
        <i class="fa-solid fa-laptop"></i>
        <span>Laptop (1440px)</span>
      </button>
      <button type="button" class="viewport-btn" data-viewport="tablet" title="Tablet / Phone Chrome Desktop Mode (980px)">
        <i class="fa-solid fa-tablet-screen-button"></i>
        <span>Phone Desktop (980px)</span>
      </button>
      <button type="button" class="viewport-btn" data-viewport="mobile" title="Mobile Phone (390px)">
        <i class="fa-solid fa-mobile-screen"></i>
        <span>Mobile (390px)</span>
      </button>
    </div>

    <!-- Actions & Tools -->
    <div class="header-actions">
      <button type="button" class="btn-tool" id="btn-theme-toggle" title="Toggle Dark/Light Mode">
        <i class="fa-solid fa-circle-half-stroke"></i>
      </button>
      <button type="button" class="btn-tool" id="btn-popout" title="Open Preview in New Tab">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </button>
      <button type="button" class="btn-primary" id="btn-export-html">
        <i class="fa-solid fa-download"></i>
        <span>Export HTML</span>
      </button>
    </div>
  </header>

  <!-- Main Studio Workspace -->
  <div class="app-workspace">

    <!-- Left Templates Catalog Sidebar -->
    <aside class="catalog-sidebar">
      <div class="sidebar-search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="catalog-search" placeholder="Search 30 templates..." aria-label="Search portfolio templates">
      </div>

      <!-- Category Filter Tabs -->
      <div class="category-tabs" role="tablist">
        <button type="button" class="cat-tab active" data-category="all">All (31)</button>
        <button type="button" class="cat-tab" data-category="academic">Academic (10)</button>
        <button type="button" class="cat-tab" data-category="tech">Tech &amp; AI (10)</button>
        <button type="button" class="cat-tab" data-category="corporate">Corporate (10)</button>
        <button type="button" class="cat-tab" data-category="custom">Custom (1)</button>
      </div>

      <!-- Template Items List -->
      <div class="template-list" id="template-items-container">
        <!-- Rendered by JS -->
      </div>
    </aside>

    <!-- Center Preview Workbench Canvas -->
    <main class="workbench-canvas">
      <div class="canvas-toolbar">
        <div class="canvas-meta">
          <span class="active-template-name" id="label-active-template">Flagship Academic &amp; Research Scholar</span>
          <span class="active-viewport-size" id="label-active-size">1440 &times; auto</span>
        </div>
        <div class="canvas-actions">
          <button type="button" class="btn-canvas-action" id="btn-refresh-preview" title="Reload Preview">
            <i class="fa-solid fa-rotate-right"></i> Refresh
          </button>
        </div>
      </div>

      <!-- Responsive Preview Frame Container -->
      <div class="frame-viewport-stage" id="frame-stage">
        <div class="preview-device-wrapper viewport-laptop" id="device-wrapper">
          <iframe id="preview-iframe" title="ZunDeck Live Template Preview" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
        </div>
      </div>
    </main>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
